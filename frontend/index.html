<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Google busca /favicon.ico ademas de los <link>: es el icono que
         aparece al lado del resultado de busqueda. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <!-- Google toma el icono de los resultados en multiplos de 48 px. -->
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon-512.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- La foto de portada es lo primero que se ve y la pide React recien
         cuando arranca: precargarla adelanta el pixel mas grande de la pagina. -->
    <link
      rel="preload"
      as="image"
      href="/imagenes/portada.webp"
      type="image/webp"
      media="(min-width: 641px)"
      fetchpriority="high"
    />
    <link
      rel="preload"
      as="image"
      href="/imagenes/portada-900.webp"
      type="image/webp"
      media="(max-width: 640px)"
      fetchpriority="high"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>MO Impresiones — Imprenta en Córdoba, Argentina</title>
    <meta
      name="description"
      content="Empresa gráfica familiar de Córdoba con más de 30 años de trayectoria. Impresión offset, packaging, editorial, impresos numerados y regalos empresariales."
    />

    <!-- Vista previa al compartir. Va en el HTML y no solo desde React porque
         WhatsApp y Facebook no ejecutan JavaScript: leen esto y nada mas. -->
    <link rel="canonical" href="https://moimpresiones.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MO Impresiones" />
    <meta property="og:locale" content="es_AR" />
    <meta property="og:title" content="MO Impresiones — Imprenta en Córdoba, Argentina" />
    <meta
      property="og:description"
      content="Empresa gráfica familiar de Córdoba con más de 30 años de trayectoria. Impresión offset, packaging, editorial, impresos numerados y regalos empresariales."
    />
    <meta property="og:url" content="https://moimpresiones.com/" />
    <meta property="og:image" content="https://moimpresiones.com/imagenes/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="MO Impresiones, imprenta en Córdoba" />
    <meta name="twitter:card" content="summary_large_image" />
    <script type="application/ld+json" id="datos-estructurados-negocio">
      {
        "@context": "https://schema.org",
        "@type": "PrintingService",
        "name": "MO Impresiones",
        "description": "Empresa gráfica familiar de Córdoba, Argentina, con más de 30 años de trayectoria en impresión offset, packaging, editorial e impresos numerados.",
        "url": "https://moimpresiones.com",
        "logo": "https://moimpresiones.com/imagenes/logo.webp",
        "image": "https://moimpresiones.com/imagenes/og.jpg",
        "foundingDate": "1994",
        "telephone": "+5493516211435",
        "email": "contacto@moimpresiones.com",
        "sameAs": ["https://instagram.com/mo.impresiones"],
        "areaServed": { "@type": "Country", "name": "Argentina" },
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "José Javier Díaz 50",
          "addressLocality": "Córdoba",
          "addressRegion": "Córdoba",
          "addressCountry": "AR"
        },
        "geo": {
          "@type": "GeoCoordinates",
          "latitude": -31.4453068,
          "longitude": -64.1974441
        },
        "openingHoursSpecification": [
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"],
            "opens": "08:00",
            "closes": "16:00"
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
