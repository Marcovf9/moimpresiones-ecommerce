# Configuracion del frontend en Netlify.
#
# El backend se publica en api.moimpresiones.com (dominio propio en Render,
# registro CNAME en GoDaddy). Asi el sitio no depende de la direccion
# onrender.com: si cambia el hosting, solo se toca el DNS.

[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # A donde le habla el sitio. Vite la fija en el momento del build.
  VITE_API_URL = "https://api.moimpresiones.com"
  # Medicion de Google. Se cargan en Netlify (Site configuration -> Environment
  # variables), no aca: cambiarlas no deberia requerir tocar el repositorio.
  # Mientras esten vacias, el sitio no carga ninguna etiqueta ni pide cookies.
  #   VITE_GOOGLE_ADS_ID     AW-1234567890
  #   VITE_GOOGLE_ADS_LABEL  la etiqueta de la conversion
  #   VITE_GA_ID             G-XXXXXXXXXX (opcional)

# El sitemap y el robots.txt los genera el backend a partir del catalogo, pero
# Google los busca en el dominio del sitio: Netlify los trae del backend.
[[redirects]]
  from = "/sitemap.xml"
  to = "https://api.moimpresiones.com/sitemap.xml"
  status = 200
  force = true

[[redirects]]
  from = "/robots.txt"
  to = "https://api.moimpresiones.com/robots.txt"
  status = 200
  force = true

# Es una aplicacion de una sola pagina: cualquier ruta que no sea un archivo
# devuelve index.html. Sin esto, recargar /productos/estuches da 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cabeceras de seguridad del sitio. Las del backend solo cubren la API.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # Aunque el sitio no muestre contenido de terceros, si alguna vez entra
    # texto ajeno (un producto cargado desde el panel, por ejemplo), esto acota
    # a donde podria llegar: nada de dominios raros para datos, imagenes o
    # formularios, y el sitio no se puede meter dentro de un iframe ajeno.
    #
    # script-src acepta 'unsafe-inline' por los datos estructurados de
    # schema.org, que van en un <script> dentro de la pagina y cambian segun la
    # pantalla, asi que no se les puede calcular un hash fijo.
    # Las de googletagmanager, google-analytics, googleadservices y doubleclick
    # son para la medicion de Google Ads: la etiqueta se carga desde ahi y
    # avisa la conversion con pedidos a esos dominios.
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://res.cloudinary.com https://tile.openstreetmap.org https://*.tile.openstreetmap.org https://www.google.com https://www.google.com.ar https://www.googletagmanager.com https://www.google-analytics.com https://googleads.g.doubleclick.net https://www.googleadservices.com; connect-src 'self' https://api.moimpresiones.com https://www.google-analytics.com https://analytics.google.com https://region1.google-analytics.com https://www.googletagmanager.com https://googleads.g.doubleclick.net https://www.googleadservices.com; frame-src https://td.doubleclick.net https://www.googletagmanager.com; upgrade-insecure-requests"

# Los archivos del build llevan un hash en el nombre: se pueden cachear un año.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
