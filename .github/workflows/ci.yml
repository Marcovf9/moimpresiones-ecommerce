# Integracion continua: backend y frontend se prueban por separado, asi un
# fallo dice de entrada de que lado esta.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  backend:
    name: Backend (Java 21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Tests
        working-directory: backend
        run: ./mvnw -B test

      - name: Empaquetado
        working-directory: backend
        run: ./mvnw -B -DskipTests package

  frontend:
    name: Frontend (Node 22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Dependencias
        working-directory: frontend
        run: npm ci

      - name: Tests
        working-directory: frontend
        run: npm test

      # El build corre tsc antes de Vite: cubre tipos y compilacion de una vez,
      # que es lo mismo que hace Netlify al publicar.
      - name: Build
        working-directory: frontend
        run: npm run build
